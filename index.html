<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>For Ireti</title>
    <meta name="robots" content="noindex" />
    <meta property="og:title" content="For Ireti" />
    <meta property="og:description" content="A letter, just for you. Enter the passcode to open it." />
    <meta property="og:image" content="https://ireti-mi-corazon.vercel.app/assets/images/passcode.jpeg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ireti-mi-corazon.vercel.app/" />
    <meta name="theme-color" content="#e3cbc6" />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/images/icon-180.png">
    <meta name="apple-mobile-web-app-title" content="For Ireti">
    <link rel="preload" href="assets/fonts/kaushan-script-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <script>
        // Already unlocked on this device: go straight to the letter.
        try { if (localStorage.getItem('unlocked')) location.replace('card.html'); } catch (e) { }
    </script>
</head>

<body>
    <main class="gate">
        <article class="sheet">
            <figure class="photo photo--hero">
                <img src="assets/images/passcode.jpeg" alt="Our hands held together" width="810" height="1080">
                <figcaption>just us</figcaption>
            </figure>

            <header class="sheet-head">
                <h1 class="hand name">for Ireti</h1>
            </header>
            <p class="lead">A letter, for your eyes only.</p>

            <form id="passcode-form" novalidate>
                <label for="password">the passcode</label>
                <input id="password" type="password" inputmode="numeric" autocomplete="off" placeholder="····" aria-describedby="hint error-msg">
                <button class="open" type="submit">
                    open it
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="none"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" /></svg>
                </button>
                <p id="error-msg" class="error" role="alert"></p>
            </form>

            <p class="hint" id="hint">hint: the day we <em>finally</em> got together</p>
        </article>
    </main>

    <script>
        const PASSCODE = '1803';
        const form = document.getElementById('passcode-form');
        const input = document.getElementById('password');
        const error = document.getElementById('error-msg');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim() === PASSCODE) {
                try { localStorage.setItem('unlocked', '1'); } catch (err) { }
                location.href = 'card.html';
                return;
            }
            error.textContent = input.value.trim() ? "That's not it, love. Try again." : 'Type the four numbers first.';
            form.classList.remove('shake');
            void form.offsetWidth; // restart the shake on every miss
            form.classList.add('shake');
            input.select();
        });
    </script>
</body>

</html>
